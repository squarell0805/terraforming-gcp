#cloud-config
runcmd:
  - echo "Starting Nat VM Config"
  - echo "Port 22" >> /etc/ssh/sshd_config
  - echo "Port 8022" >> /etc/ssh/sshd_config
  - systemctl restart ssh.service
  - sysctl -w net.ipv4.ip_forward=1
  - echo "net.ipv4.ip_forward=1" | tee /etc/sysctl.d/99-ip-forward.conf
  - iptables -t nat -A POSTROUTING -o ens4 -j MASQUERADE
  - apt update && apt install netfilter-persistent
  - echo "yes" | netfilter-persistent save
  - ip route add 10.0.0.0/16 via 10.0.0.1 dev ens5
  - echo "Nat VM Config Completed"