#cloud-config

package_update: true
packages:
  - iptables-persistent
  - netfilter-persistent

write_files:
  - path: /etc/sysctl.d/99-ip-forward.conf
    content: |
      net.ipv4.ip_forward=1
    permissions: '0644'
  - path: /etc/netplan/99-custom-routes.yaml
    content: |
      network:
        version: 2
        ethernets:
          ens5:
            routes:
              - to: 10.0.0.0/16
                via: 10.0.0.1
    permissions: '0644'

runcmd:
  - echo "Starting Nat VM Config"
  - echo "Port 22" >> /etc/ssh/sshd_config
  - echo "Port 8022" >> /etc/ssh/sshd_config
  - systemctl restart ssh.service
  - sysctl -w net.ipv4.ip_forward=1
  - iptables -t nat -A POSTROUTING -o ens4 -j MASQUERADE
  - echo "yes" | netfilter-persistent save
  - netplan apply
  - echo "Nat VM Config Completed"
